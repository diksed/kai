org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier rewrites old support-library references to AndroidX; every
# dependency here already ships AndroidX-native, so it was just dead work
# (and, with a low default heap, the cause of an out-of-memory build
# failure on newer AGP).
android.enableJetifier=false
